name: release-please

# GitOps release automation, step 1 of 2 (see publish.yml for step 2):
#
# 1. Every push to master runs this workflow. release-please reads the
#    commits since the last release, looking for Conventional Commits
#    prefixes (feat:, fix:, feat!:/BREAKING CHANGE:, etc.) and keeps a
#    single open "chore(master): release X.Y.Z" pull request up to date
#    with the version bump (pyproject.toml + xii/django_river/__init__.py,
#    see release-please-config.json) and an autogenerated CHANGELOG.md.
# 2. Nothing is published yet at this point - the release PR is just a
#    normal PR, gated by the same CI checks (ci.yml) as any other PR.
# 3. When a maintainer reviews and merges that PR into master,
#    release-please tags the merge commit and creates a GitHub Release from
#    it. That "release: published" event is what triggers publish.yml,
#    which builds and uploads to PyPI.
#
# See RELEASING.md for the full picture, including the one-time PyPI/GitHub
# setup this depends on.

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v6
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
